spring.threads.virtual.enabled=true

# Google Cloud & GenAI Connection Settings
spring.cloud.gcp.project-id=${GOOGLE_CLOUD_PROJECT:${GCP_PROJECT:${DEVSHELL_PROJECT_ID:${SPRING_AI_GOOGLE_GENAI_PROJECT_ID:math-play}}}}
spring.cloud.gcp.datastore.project-id=${GOOGLE_CLOUD_PROJECT:${GCP_PROJECT:${DEVSHELL_PROJECT_ID:${SPRING_AI_GOOGLE_GENAI_PROJECT_ID:math-play}}}}
spring.ai.google.genai.project-id=${SPRING_AI_GOOGLE_GENAI_PROJECT_ID:${GOOGLE_CLOUD_PROJECT:${GCP_PROJECT:${DEVSHELL_PROJECT_ID:math-play}}}}
spring.ai.google.genai.location=${SPRING_AI_GOOGLE_GENAI_LOCATION:global}

# Google GenAI Chat Model
spring.ai.google.genai.chat.model=${SPRING_AI_GOOGLE_GENAI_MODEL:gemini-3.8-flash}
