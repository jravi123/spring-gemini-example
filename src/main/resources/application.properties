spring.threads.virtual.enabled=true

# Google GenAI Connection Settings
spring.ai.google.genai.project-id=${SPRING_AI_GOOGLE_GENAI_PROJECT_ID:mbcc-test}
spring.ai.google.genai.location=${SPRING_AI_GOOGLE_GENAI_LOCATION:global}

# Google GenAI Chat Model Options
spring.ai.google.genai.chat.options.model=${SPRING_AI_GOOGLE_GENAI_MODEL:gemini-2.5-flash}
spring.ai.google.genai.chat.options.temperature=0.2
spring.ai.google.genai.chat.options.top-k=5
spring.ai.google.genai.chat.options.top-p=0.95

# Disable GCP Client-Side Metrics & OpenTelemetry Exporters
google.cloud.enable-client-side-metrics=false
otel.sdk.disabled=true
otel.metrics.exporter=none
otel.traces.exporter=none
otel.logs.exporter=none
