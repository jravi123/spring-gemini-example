spring.threads.virtual.enabled=true

# Google Cloud & GenAI Connection Settings
spring.cloud.gcp.project-id=${GOOGLE_CLOUD_PROJECT:${GCP_PROJECT:${DEVSHELL_PROJECT_ID:${SPRING_AI_GOOGLE_GENAI_PROJECT_ID:}}}}
spring.cloud.gcp.datastore.project-id=${GOOGLE_CLOUD_PROJECT:${GCP_PROJECT:${DEVSHELL_PROJECT_ID:${SPRING_AI_GOOGLE_GENAI_PROJECT_ID:}}}}
spring.ai.google.genai.project-id=${SPRING_AI_GOOGLE_GENAI_PROJECT_ID:${GOOGLE_CLOUD_PROJECT:${GCP_PROJECT:${DEVSHELL_PROJECT_ID:}}}}
spring.ai.google.genai.location=${SPRING_AI_GOOGLE_GENAI_LOCATION:global}

# Google GenAI Chat Model Options
spring.ai.google.genai.chat.model=${SPRING_AI_GOOGLE_GENAI_MODEL:gemini-3.8-flash}
spring.ai.google.genai.chat.options.model=${SPRING_AI_GOOGLE_GENAI_MODEL:gemini-3.8-flash}
spring.ai.google.genai.chat.options.temperature=0.2
spring.ai.google.genai.chat.options.top-k=5
spring.ai.google.genai.chat.options.top-p=0.95

# Disable GCP Client-Side Metrics & OpenTelemetry Exporters
google.cloud.enable-client-side-metrics=false
otel.sdk.disabled=true
otel.metrics.exporter=none
otel.traces.exporter=none
otel.logs.exporter=none
