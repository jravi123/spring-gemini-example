<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Your Personal Travel Agent</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts - Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <!-- Application Styles -->
    <link rel="stylesheet" href="/css/styles.css">
</head>
<body class="min-h-screen bg-gradient-to-br from-blue-100 to-purple-100 p-4 flex items-center justify-center">
    <main class="bg-white p-8 rounded-2xl shadow-xl w-full max-w-4xl border border-gray-200">
        <h1 class="text-4xl font-bold text-center text-gray-800 mb-8">
            Your Personal Travel Agent <span aria-hidden="true">✈️</span>
        </h1>

        <form id="travelForm" action="/ai/plan" method="POST" novalidate>
            <fieldset class="grid grid-cols-1 md:grid-cols-2 gap-6 mb-8">
                <legend class="sr-only">Travel Preferences</legend>

                <!-- Input for Destination -->
                <div class="relative">
                    <label for="destination" class="block text-gray-700 text-sm font-semibold mb-2">
                        Preferred Destination
                    </label>
                    <input
                        type="text"
                        id="destination"
                        name="destination"
                        maxlength="200"
                        placeholder="e.g., Paris, Japan, Beach vacation (optional)"
                        class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-blue-500 focus:border-blue-500 transition duration-200"
                    />
                </div>

                <!-- Input for Dates/Duration -->
                <div class="relative">
                    <label for="dates" class="block text-gray-700 text-sm font-semibold mb-2">
                        Travel Dates / Duration
                    </label>
                    <input
                        type="text"
                        id="dates"
                        name="dates"
                        maxlength="200"
                        placeholder="e.g., 2 weeks in August, long weekend (optional)"
                        class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-blue-500 focus:border-blue-500 transition duration-200"
                    />
                </div>

                <!-- Input for Interests -->
                <div class="relative">
                    <label for="interests" class="block text-gray-700 text-sm font-semibold mb-2">
                        Interests
                    </label>
                    <input
                        type="text"
                        id="interests"
                        name="interests"
                        maxlength="500"
                        placeholder="e.g., hiking, history, food, relaxation"
                        class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-blue-500 focus:border-blue-500 transition duration-200"
                    />
                </div>

                <!-- Input for Budget -->
                <div class="relative">
                    <label for="budget" class="block text-gray-700 text-sm font-semibold mb-2">
                        Budget
                    </label>
                    <input
                        type="text"
                        id="budget"
                        name="budget"
                        maxlength="200"
                        placeholder="e.g., budget-friendly, moderate, luxury"
                        class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-blue-500 focus:border-blue-500 transition duration-200"
                    />
                </div>
            </fieldset>

            <!-- Generate Suggestions Button -->
            <div class="text-center mb-8">
                <button
                    type="submit"
                    id="generateBtn"
                    class="inline-flex items-center justify-center gap-2 px-8 py-3 rounded-full text-white font-semibold text-lg transition duration-300 ease-in-out bg-gradient-to-r from-blue-500 to-purple-600 hover:from-blue-600 hover:to-purple-700 shadow-lg hover:shadow-xl transform hover:scale-105"
                >
                    <svg id="generateBtnSpinner" class="hidden animate-spin h-5 w-5 text-white" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" aria-hidden="true">
                        <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                        <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
                    </svg>
                    <span id="generateBtnText">Get Travel Suggestions</span>
                </button>
            </div>
        </form>

        <!-- Display Area for Error -->
        <div id="errorDisplay" class="hidden bg-red-100 border border-red-400 text-red-700 px-4 py-3 rounded-lg relative mb-6" role="alert" aria-live="assertive">
            <strong class="font-bold">Error:</strong>
            <span id="errorMessage" class="block sm:inline ml-2"></span>
        </div>

        <!-- Display Area for Suggestions -->
        <section id="suggestionsDisplay" class="hidden mt-8 bg-blue-50 p-6 rounded-xl border border-blue-200 shadow-inner" aria-live="polite">
            <h2 class="text-2xl font-bold text-gray-700 mb-4">Your Personalized Travel Plan:</h2>
            <div id="suggestionsContent" class="markdown-body max-w-none text-gray-800 leading-relaxed"></div>
        </section>

        <!-- Chat Interface (Initially hidden) -->
        <section id="chatContainer" class="hidden mt-8 p-6 bg-gray-50 rounded-xl border border-gray-200 shadow-inner">
            <h2 class="text-2xl font-bold text-gray-700 mb-4">Chat with your Travel Agent:</h2>
            <div id="chatHistoryDisplay" class="mb-4 max-h-96 overflow-y-auto space-y-2" role="log" aria-live="polite" aria-label="Conversation history">
                <!-- Chat messages will appear here -->
            </div>
            <form id="chatForm" action="/ai/chat" method="POST" class="flex gap-2">
                <label for="chatInput" class="sr-only">Ask a follow-up question</label>
                <input
                    type="text"
                    id="chatInput"
                    name="chatInput"
                    maxlength="2000"
                    placeholder="Ask a follow-up question..."
                    enterkeyhint="send"
                    class="flex-grow px-4 py-2 border border-gray-300 rounded-lg focus:ring-blue-500 focus:border-blue-500 transition duration-200"
                />
                <button
                    type="submit"
                    id="sendChatBtn"
                    aria-label="Send follow-up question"
                    class="px-4 py-2 rounded-lg text-white font-semibold bg-blue-500 hover:bg-blue-600 transition duration-200 flex items-center justify-center"
                >
                    <svg id="sendChatSpinner" class="hidden animate-spin h-5 w-5 text-white" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" aria-hidden="true">
                        <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                        <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
                    </svg>
                    <svg id="sendChatIcon" xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2" aria-hidden="true">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M13 5l7 7-7 7M5 12h14" />
                    </svg>
                </button>
            </form>
        </section>
    </main>

    <script type="module" src="/js/app.js"></script>
</body>
</html>
